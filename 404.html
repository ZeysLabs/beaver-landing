<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Page not found — Beaver</title>
  <style>
    :root { color-scheme: light dark; --paper: #f2eee6; --ink: #1c1a17; --muted: #77736c; --accent: #b9651d; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1c1a17; --ink: #f2eee6; --muted: #aaa49a; --accent: #d98a43; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100%, 42rem); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); padding: clamp(2rem, 8vw, 5rem); }
    p { margin: 0 0 1.5rem; color: var(--muted); font: 0.7rem/1.5 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 2rem; font-size: clamp(2rem, 6vw, 3.8rem); font-weight: 400; line-height: 1.08; }
    a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: .3em; }
    a:hover { color: var(--accent); }
  </style>
</head>
<body><main><p>Beaver · 404</p><h1>Page not found</h1><a href="/">Back to Beaver</a></main></body>
</html>
